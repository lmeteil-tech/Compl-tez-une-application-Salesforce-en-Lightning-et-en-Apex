<template>
    <lightning-card title="Recherche de Cas par Sujet" icon-name="standard:case">
        <div class="slds-p-around_medium">
            <lightning-input label="Rechercher par Sujet"
                             value={searchTerm}
                             onchange={updateSearchTerm}>
            </lightning-input>
            <lightning-button label="Rechercher"
                              variant="brand"
                              onclick={handleSearch}
                              class="slds-m-top_small">
            </lightning-button>
        </div>
        <template if:true={cases}>
            <lightning-datatable key-field="Id"
                                 columns={columns}
                                 data={cases.data}                                 
                                 >
            </lightning-datatable>
        </template>
        <template if:true={error}>
            <p class="slds-p-around_medium slds-text-color_error">Erreur : {error}</p>
        </template>
    </lightning-card>
</template>
